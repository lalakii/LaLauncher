plugins {
    id "com.android.application" version "9.4.0"
    id "cn.lalaki.buildSrc" version "1.2.2"
    id "checkstyle"
}
android {
    namespace = "c"
    compileSdk 37
    buildToolsVersion = "37.0.0"
    defaultConfig {
        //noinspection ExpiredTargetSdkVersion
        targetSdk = 29
        applicationId "cn.lalaki"
        minSdk = 1
        versionCode 1
        versionName "1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }
    signingConfigs {
        release {
            enableV1Signing = true
            enableV2Signing = false
            enableV3Signing = false
            enableV4Signing = false
            keyAlias = "1"
            keyPassword = "1"
            storePassword = "1"
            storeFile = file("D:\\lalaki-legacy.jks")
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            jniDebuggable false
            debuggable false
            isDefault = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = signingConfigs.release
            optimization {
                enable = true
            }
            vcsInfo.include = false
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repackageConfig {
    // *Sign your apk
    autoSign = true
    storeFile = "C:\\Users\\i\\Desktop\\bak\\lalaki.jks"
    keyAlias = "0"
    ksPass = "111111"
    keyPass = "111111"
    signerName = "_"
    includeMetaData = false
    debugKt = false
    blackList = List.of("*.version", "kotlin*", "resources.arsc*")
    printOutputApk = true
    disabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-g:none']
}

checkstyle {
    configFile = file("config/checkstyle/checkstyle.xml")
    ignoreFailures = false
    showViolations = true
    maxErrors = 0
    maxWarnings = 0
}

tasks.named("clean").configure {
    it.finalizedBy(tasks.named("check"))
}
